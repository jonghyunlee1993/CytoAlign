experiment:
  name: base
  fold: 0
  seed: 4207

data:
  root: data/AML
  source_modality: spectral_flow
  target_modality: cytof
  sampling: reservoir
  max_cells_per_specimen: 50000
  chunk_size: 100000
  sample_seed: 4207
  split:
    n_splits: 5
    seed: 42
    validation_fraction: 0.15

preprocessing:
  n_knots: 129
  max_fit_cells: 250000

training:
  device: cuda
  max_fit_cells: 250000
  residual_baseline: ridge_hl
  ot:
    k_max: 256
    k_min: 32
    epsilon_ratio: 0.1
    sinkhorn_iterations: 300
  mlp:
    hidden_dims: [128, 128]
    epochs: 30
    batch_size: 4096
    learning_rate: 0.001
    patience: 5
  knn:
    k: 50
    max_reference_cells: 50000
    n_jobs: 4

evaluation:
  alphas: [0.0, 0.1, 0.25, 0.5, 1.0]

output:
  root: outputs
  save_models: true
