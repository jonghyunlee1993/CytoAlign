extends: sf_to_cytof_paired_curve.yaml

experiment:
  name: smoke_paired_curve
  paired_counts: [0, 1, 2]

data:
  sampling: head
  max_cells_per_specimen: 100

preprocessing:
  max_fit_cells: 3000

training:
  device: cpu
  max_fit_cells: 3000
  ot:
    k_max: 16
    k_min: 4
    sinkhorn_iterations: 30
  mlp:
    hidden_dims: [16]
    epochs: 1
    batch_size: 128
    patience: 1
  knn:
    k: 10
    max_reference_cells: 3000
    n_jobs: 1
